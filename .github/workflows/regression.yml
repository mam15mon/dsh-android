name: Build DSH Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 留空只构建，填写更新说明则发布正式版
        type: string
        default: ''

permissions:
  contents: read

jobs:
  android-client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Test Android client
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests '*ProvidersTest' --tests '*CodexModelsTest' --tests '*BallGeometryTest' \
            --tests '*VoiceMachineTest' --tests '*Update*Test' --tests '*ApkCheckTest' \
            --tests '*LockStateTest' --console=plain
      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Build signed release client
        if: github.event_name != 'pull_request'
        env:
          DSH_ANDROID_KEYSTORE_B64: ${{ secrets.DSH_ANDROID_KEYSTORE_B64 }}
          DSH_ANDROID_STORE_PASSWORD: ${{ secrets.DSH_ANDROID_STORE_PASSWORD }}
          DSH_ANDROID_KEYSTORE: ${{ runner.temp }}/dsh-android.keystore
        run: |
          set -euo pipefail
          test -n "$DSH_ANDROID_KEYSTORE_B64"
          test -n "$DSH_ANDROID_STORE_PASSWORD"
          printf '%s' "$DSH_ANDROID_KEYSTORE_B64" | base64 --decode > "$DSH_ANDROID_KEYSTORE"
          ./gradlew assembleRelease --console=plain
          apk=app/build/outputs/apk/release/app-release.apk
          python tools/verify-native-alignment.py "$apk"
          python tools/verify-client.py "$apk"
          version=$(jq -er '.versionName' client.json)
          filename="DSH-Android-${version}-arm64.apk"
          mkdir -p build/client
          cp "$apk" "build/client/$filename"
          (cd build/client && sha256sum "$filename" > "$filename.sha256")
      - name: Generate online update manifest
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_notes != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          gh release download --pattern update.json --output "$RUNNER_TEMP/previous-update.json"
          previous_signer=$(jq -er '.signerSha256 | select(test("^[a-f0-9]{64}$"))' "$RUNNER_TEMP/previous-update.json")
          previous_code=$(jq -er '.versionCode | numbers' "$RUNNER_TEMP/previous-update.json")
          version=$(jq -er '.versionName' client.json)
          directory=build/client
          printf '%s\n' "$RELEASE_NOTES" > "$directory/release-notes.md"
          python tools/make-update-manifest.py \
            "$directory/DSH-Android-${version}-arm64.apk" --repo "$GITHUB_REPOSITORY" \
            --notes-zh "$directory/release-notes.md" --expect-signer "$previous_signer" -o "$directory/update.json"
          jq -e --argjson previous "$previous_code" '.versionCode > $previous' "$directory/update.json"
      - name: Upload client APK and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Android-arm64
          path: build/client/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_notes != ''
    needs: android-client
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: dsh-android-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DSH-Android-arm64
      - name: Publish signed APK and online update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(jq -er '.versionName' update.json)
          code=$(jq -er '.versionCode | numbers' update.json)
          apk="DSH-Android-${version}-arm64.apk"
          sha256sum -c "$apk.sha256"
          test "$(sha256sum "$apk" | cut -d ' ' -f 1)" = "$(jq -er '.apk.sha256' update.json)"
          gh release download --pattern update.json --output "$RUNNER_TEMP/previous-update.json"
          jq -e --argjson next "$code" '.versionCode < $next' "$RUNNER_TEMP/previous-update.json"
          tag="v$version"
          gh release create "$tag" "$apk" "$apk.sha256" update.json --target "$GITHUB_SHA" \
            --title "DSH 安卓 $tag" --notes-file release-notes.md --latest
